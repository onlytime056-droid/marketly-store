name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
        env:
          GITHUB_PAGES: "1"
      - name: Prepare static site
        run: |
          OUT=$(dirname "$(find dist .output -name index.html -path '*client*' | head -1)")
          echo "Static output: $OUT"
          cp "$OUT/index.html" "$OUT/404.html"
          echo "raidsaker.online" > "$OUT/CNAME"
          touch "$OUT/.nojekyll"
          echo "OUT=$OUT" >> $GITHUB_ENV
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT }}
      - id: deployment
        uses: actions/deploy-pages@v4
